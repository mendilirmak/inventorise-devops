# Settings for the kube-prometheus-stack chart (version pinned in
# scripts/monitoring-up.sh). Only what differs from the chart defaults.

# This project has no alerting (out of scope), so Alertmanager and the chart's
# built-in alert rules are switched off.
alertmanager:
  enabled: false
defaultRules:
  create: false

grafana:
  # The admin login comes from the Secret "grafana-admin" (created with a random
  # password by scripts/monitoring-up.sh). The password is never in this file.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Keep the chart's own Kubernetes dashboards. Ours is added by the sidecar
  # from any ConfigMap labelled grafana_dashboard: "1".
  defaultDashboardsEnabled: true

prometheus:
  prometheusSpec:
    # Find ServiceMonitors in every namespace, not only those with this Helm
    # release's label. Our app's ServiceMonitor lives in its own namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Keep 2 days of data: enough for the demo, and it fits on a small disk.
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
