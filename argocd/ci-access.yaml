# What Jenkins may do in the cluster. Jenkins logs in as the service account
# "jenkins-ci". Its rights are limited to the `inventory` namespace, plus
# read-only access to Argo CD applications. It cannot read any Secret.
#
#   Needed for                         Permission
#   --------------------------------   ----------------------------------------
#   Sync and verify stage              read Argo CD applications (argocd)
#   Smoke stage: create smoke user     get pods/deployments, exec into pods (inventory)
#   Smoke stage: trust the private CA  read the public CA certificate ConfigMap (inventory)
#   Smoke stage: find a worker         list pods in ingress-nginx (their node IP)
#
# Accepted risk: "exec into pods" lets the token run commands in the app pods,
# and those pods hold the database password. The risk is limited to one
# namespace, the token is stored only in Jenkins, and the CI node has no public
# address. Production fix: a separate, audited job for creating users.
#
# Applied by scripts/ec2-bootstrap.sh. It is outside the overlay, so Argo CD
# does not manage or prune it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci
  namespace: inventory
---
# Kubernetes does not create a token for a service account by itself. This
# Secret asks for one. scripts/make-ci-kubeconfig.sh reads it.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-ci-token
  namespace: inventory
  annotations:
    kubernetes.io/service-account.name: jenkins-ci
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-ci
  namespace: inventory
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [inventorise-ca-cert]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-ci
  namespace: inventory
subjects:
  - kind: ServiceAccount
    name: jenkins-ci
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-ci-read-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-ci-read-applications
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: jenkins-ci
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-ci-read-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-ci-find-ingress
  namespace: ingress-nginx
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-ci-find-ingress
  namespace: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: jenkins-ci
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-ci-find-ingress
