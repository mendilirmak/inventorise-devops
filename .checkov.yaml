# Checkov settings, used by the Jenkins pipeline (IaC scan stage).
# Every skipped check needs a reason. Keep this list short.
skip-check:
  # Image pull policy "Always": each image tag is a unique commit SHA, so a
  # cached copy is never out of date.
  - CKV_K8S_15
  # Secrets as env vars instead of files: the app reads all its settings from
  # env vars (12-factor). Mounting secrets as files is a later improvement.
  - CKV_K8S_35
  # Image digest: images are pinned to exact tags. Pinning digests is the
  # stricter production choice; tags keep the manifests readable.
  - CKV_K8S_43
  # Detailed CloudWatch monitoring costs extra per instance (about $2 each).
  # Prometheus already collects the metrics we need.
  - CKV_AWS_126
  # Port 80 is open to the world on purpose: it only redirects to HTTPS.
  # Port 443 does the real work.
  - CKV_AWS_260
  # IAM roles for instances: no instance calls the AWS API, and our CLI user
  # may use EC2 only (see the IAM policy in CLAUDE.md).
  - CKV2_AWS_41
  # VPC flow logs need CloudWatch or S3, which are outside our EC2-only scope.
  - CKV2_AWS_11
