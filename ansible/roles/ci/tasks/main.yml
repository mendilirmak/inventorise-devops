# The CI node: Docker, plus Jenkins running as a container under systemd.
# Jenkins uses our own image (jenkins/Dockerfile): the official LTS image plus
# the Docker CLI, kubectl and the pinned plugins.
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Docker runs at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Folder for the Jenkins image sources
  ansible.builtin.file:
    path: /opt/jenkins-build
    state: directory
    mode: "0755"

- name: Copy the Jenkins Dockerfile and plugin list
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../jenkins/{{ item }}"
    dest: "/opt/jenkins-build/{{ item }}"
    mode: "0644"
  loop: [Dockerfile, plugins.txt]
  register: jenkins_sources

- name: Is the Jenkins image already built?
  ansible.builtin.command: docker image inspect {{ jenkins_image }}
  register: jenkins_image_present
  changed_when: false
  failed_when: false

- name: Build the Jenkins image (only when the sources changed or it is missing)
  ansible.builtin.command: docker build --pull -t {{ jenkins_image }} /opt/jenkins-build
  when: jenkins_sources.changed or jenkins_image_present.rc != 0
  notify: Restart Jenkins

# Jenkins data lives on the host, at the SAME path inside the container. The
# pipeline starts tool containers that mount the workspace by path, and the
# Docker daemon resolves those paths on the host.
- name: Jenkins home folder (owned by the jenkins user, uid 1000)
  ansible.builtin.file:
    path: /var/jenkins_home
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Find the group id of the docker group
  ansible.builtin.getent:
    database: group
    key: docker

- name: Jenkins service (systemd)
  ansible.builtin.template:
    src: jenkins.service.j2
    dest: /etc/systemd/system/jenkins.service
    mode: "0644"
  notify: Restart Jenkins

- name: Start Jenkins at boot
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: true
    daemon_reload: true
