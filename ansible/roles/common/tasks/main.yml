- name: Set the hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update the apt package list
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - chrony              # keeps the clock right (certificates and etcd need it)
      - unattended-upgrades # installs security updates automatically
    state: present

- name: SSH hardening (key login only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  notify: Restart ssh

- name: Make sure chrony runs
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
