# Stable in-cluster address for the app pods: http://app.inventory.svc
# ClusterIP = reachable only inside the cluster; outside traffic comes in
# through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-app
  ports:
    - name: http          # named, so the Prometheus ServiceMonitor can refer to it
      port: 80
      targetPort: http
