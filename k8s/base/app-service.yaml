# A stable address for the app pods inside the cluster: app.inventory.svc.
# ClusterIP means only the cluster can reach it. Outside traffic comes in
# through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-app
  ports:
    - name: http          # the name lets the Prometheus ServiceMonitor refer to it
      port: 80
      targetPort: http
