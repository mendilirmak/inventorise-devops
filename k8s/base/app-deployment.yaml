# The Flask app (API + HTML UI). The image tag is set at deploy time
# (scripts/minikube-up.sh or the Jenkins pipeline), never "latest".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-app
spec:
  # No "replicas" here on purpose: the HorizontalPodAutoscaler (app-hpa.yaml)
  # owns the count (2-5). A fixed number here would reset it on every deploy.
  revisionHistoryLimit: 5          # old versions kept for `kubectl rollout undo`
  strategy:
    rollingUpdate:
      maxUnavailable: 0            # never drop below the current pod count
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-app
    spec:
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001           # the "app" user created in the Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for Postgres before starting, so the first deploy does not
        # crash-loop while the database is still initialising.
        - name: wait-for-postgres
          image: postgres:16.15
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for i in $(seq 60); do
                pg_isready -h postgres -p 5432 && exit 0
                sleep 2
              done
              echo "postgres not ready after 120s" >&2
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: dusterius/inventory-app:set-at-deploy-time
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: inventory-config
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: inventory-db, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: inventory-db, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: inventory-db, key: POSTGRES_DB}}
            # $(VAR) is filled in by Kubernetes from the variables above.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: inventory-app, key: SECRET_KEY}}
          # The HPA measures CPU as a percentage of this request, so the
          # request must be set or autoscaling does nothing.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Not ready = no traffic. Fails while the database is unreachable.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          # Not alive = restart the container. Only checks the process itself,
          # so a database outage does not cause a restart loop.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
