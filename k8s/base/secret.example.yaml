# EXAMPLE ONLY. Not applied, and the values are placeholders. It shows the shape
# of the two Secrets the app needs. scripts/create-secrets.sh creates the real
# ones with random values (ec2-bootstrap.sh runs it). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db
  namespace: inventory
type: Opaque
stringData:
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: replace-me   # letters and digits only (used inside a URL)
  POSTGRES_DB: inventory
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-app
  namespace: inventory
type: Opaque
stringData:
  SECRET_KEY: replace-me      # at least 32 random characters
