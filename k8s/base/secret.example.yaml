# EXAMPLE ONLY - not applied, not real values. It shows the shape of the two
# Secrets the app needs. They are created by:
#   - Minikube: scripts/create-secrets.sh (random values)
#   - EKS: External Secrets Operator, from AWS Secrets Manager
# Never put real values in this file or commit them anywhere.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db
  namespace: inventory
type: Opaque
stringData:
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: replace-me   # letters and digits only (used inside a URL)
  POSTGRES_DB: inventory
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-app
  namespace: inventory
type: Opaque
stringData:
  SECRET_KEY: replace-me      # at least 32 random characters
