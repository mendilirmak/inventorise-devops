# Postgres runs outside the cluster, on two EC2 instances: the primary and a
# standby. The app connects to the name "postgres". The Service below gives that
# name a fixed address. It has no pod selector, so the EndpointSlice says where
# traffic goes: the PRIMARY (inventorise-pg-1).
#
# Manual failover: promote the standby (inventorise-pg-2), change the address
# below to 10.20.2.181, and commit. Argo CD applies the change.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inventory
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: inventorise
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-external
  namespace: inventory
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
ports:
  - name: postgres
    port: 5432
    protocol: TCP
endpoints:
  - addresses: ["10.20.2.142"]
