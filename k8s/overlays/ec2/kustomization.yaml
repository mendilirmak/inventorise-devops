# The EC2 cluster (k3s). The app runs in Kubernetes. Postgres runs on its own
# EC2 instances outside the cluster (see postgres-endpoint.yaml). Everything
# shared lives in ../../base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres-endpoint.yaml
# The image tag. The Jenkins pipeline rewrites newTag after every successful
# build (stage "Update GitOps repo"). Do not edit it by hand.
images:
  - name: dusterius/inventory-app
    newTag: "f555b61502fc"
patches:
  # 1. The app connects to Postgres over TLS (sslmode=require).
  - target: {kind: Deployment, name: app}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
        namespace: inventory
      spec:
        template:
          spec:
            containers:
              - name: app
                # Kubernetes fills in $(VAR) only from variables listed ABOVE it,
                # so the three Postgres settings come first.
                env:
                  - name: POSTGRES_USER
                    valueFrom: {secretKeyRef: {name: inventory-db, key: POSTGRES_USER}}
                  - name: POSTGRES_PASSWORD
                    valueFrom: {secretKeyRef: {name: inventory-db, key: POSTGRES_PASSWORD}}
                  - name: POSTGRES_DB
                    valueFrom: {secretKeyRef: {name: inventory-db, key: POSTGRES_DB}}
                  - name: DATABASE_URL
                    value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=require
  # 2. HTTPS: cert-manager issues the certificate from our private CA.
  - target: {kind: Ingress, name: app}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: app
        namespace: inventory
        annotations:
          cert-manager.io/cluster-issuer: inventorise-ca
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
      spec:
        tls:
          - hosts: [inventory.local]
            secretName: inventory-tls
