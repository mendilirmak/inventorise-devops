# Argo CD (continuous delivery: keeps the cluster equal to what is in git).
# It is not exposed on the internet. Reach it with:
#   kubectl -n argocd port-forward svc/argocd-server 8443:443
dex:
  enabled: false             # no single sign-on needed
notifications:
  enabled: false
configs:
  params:
    server.insecure: false   # keep TLS on the Argo CD server itself
server:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
