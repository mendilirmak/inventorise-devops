# Argo CD: keeps the cluster equal to what is in git (continuous delivery).
# It is not exposed on the internet. Open its UI with:
#   kubectl -n argocd port-forward svc/argocd-server 8443:443
dex:
  enabled: false             # no single sign-on (SSO) needed
notifications:
  enabled: false
configs:
  params:
    server.insecure: false   # keep TLS on the Argo CD server itself
  cm:
    # Check git every 30 s instead of the default ~3 minutes, so the Jenkins
    # stage "Sync and verify" (180 s timeout) sees the new commit in time.
    timeout.reconciliation: 30s
    # Argo CD's default list hides EndpointSlice objects. We need it visible,
    # because our Postgres address is an EndpointSlice (k8s/overlays/ec2).
    # This is the default list minus that one entry.
    resource.exclusions: |
      ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter.
      ### EndpointSlice is NOT excluded: our Postgres address is an EndpointSlice in k8s/overlays/ec2.
      - apiGroups:
        - ''
        kinds:
        - Endpoints
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
server:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
